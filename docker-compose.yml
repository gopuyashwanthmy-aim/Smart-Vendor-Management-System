services:
  postgres:
    image: postgres:16
    container_name: smart_vendor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smart_vendor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_vendor_password}
      POSTGRES_DB: ${POSTGRES_DB:-smart_vendor}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart_vendor} -d ${POSTGRES_DB:-smart_vendor}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
